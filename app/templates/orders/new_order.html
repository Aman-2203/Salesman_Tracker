{% extends 'base.html' %}
{% block title %}Book Order{% endblock %}
{% block page_title %}Book New Order{% endblock %}
{% block page_subtitle %}Record a sales order for a customer{% endblock %}

{% block content %}
<div style="max-width: 560px; margin: 0 auto;">
  <div class="card">
    <form method="POST" action="{{ url_for('orders.new_order') }}">

      <!-- Customer -->
      <div class="form-group">
        <label for="customer_id">Customer <span class="required">*</span></label>
        <select id="customer_id" name="customer_id" required>
          <option value="">Select customer…</option>
          {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }} — {{ c.area or c.city or 'N/A' }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="divider"></div>

      <!-- Order Placed? -->
      <div class="form-group">
        <label style="font-weight:600; font-size:0.875rem; color:var(--text-secondary); margin-bottom:0.6rem; display:block;">ORDER PLACED? <span class="required">*</span></label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
          <label class="outcome-card" id="card-yes">
            <input type="radio" name="order_placed" value="yes" required style="display:none;">
            <span style="font-size:1.6rem;"><i class="bi bi-check-circle-fill text-success"></i></span>
            <span style="font-size:0.875rem; font-weight:700; margin-top:0.3rem; color:var(--success);">Yes, Order Placed</span>
          </label>
          <label class="outcome-card" id="card-no">
            <input type="radio" name="order_placed" value="no" style="display:none;">
            <span style="font-size:1.6rem;"><i class="bi bi-x-circle-fill text-danger"></i></span>
            <span style="font-size:0.875rem; font-weight:700; margin-top:0.3rem; color:var(--danger, var(--accent));">No Order</span>
          </label>
        </div>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label for="amount">Order Amount <span style="font-weight:400; color:var(--text-muted);">(optional if no order)</span></label>
        <div style="position:relative;">
          <span style="position:absolute; left:0.875rem; top:50%; transform:translateY(-50%); color:var(--text-muted); font-weight:600;">₹</span>
          <input type="number" id="amount" name="amount" min="0" step="0.01" placeholder="0.00"
                 style="padding-left:2rem;">
        </div>
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label for="notes">Notes <span style="font-weight:400; color:var(--text-muted);">(optional)</span></label>
        <textarea id="notes" name="notes" rows="3" placeholder="Special instructions, delivery date, remarks…"></textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success" style="flex:1;"><i class="bi bi-cart-check"></i> Record Order</button>
        <a href="{{ url_for('orders.list_orders') }}" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Cancel</a>
      </div>
    </form>
  </div>
</div>

<style>
.outcome-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem 0.5rem;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg-card);
  user-select: none;
}
.outcome-card:hover {
  border-color: var(--accent);
  background: var(--red-50);
}
.outcome-card.selected {
  border-color: var(--accent);
  background: var(--red-50);
  box-shadow: 0 0 0 3px rgba(220,38,38,0.12);
}
</style>
{% endblock %}

{% block extra_scripts %}
<script>
document.querySelectorAll('input[name="order_placed"]').forEach(radio => {
  radio.addEventListener('change', () => {
    document.querySelectorAll('.outcome-card').forEach(c => c.classList.remove('selected'));
    radio.closest('.outcome-card').classList.add('selected');
  });
});
</script>
{% endblock %}
