{% extends 'base.html' %}
{% block title %}Edit Customer{% endblock %}
{% block page_title %}Edit Customer{% endblock %}
{% block page_subtitle %}{{ customer.name }}{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 0 auto;">
  <div class="card">
    <form method="POST" action="{{ url_for('customers.edit_customer', cid=customer.id) }}">
      <div class="form-group">
        <label for="name">Customer / Store Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" value="{{ customer.name }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="area">Area <span class="text-muted fs-xs">(Optional)</span></label>
        <input type="text" id="area" name="area" value="{{ customer.area or '' }}" placeholder="e.g. Sector 18, Central Market">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="text-muted fs-xs">(Optional)</span></label>
        <input type="tel" id="phone" name="phone" value="{{ customer.phone or '' }}" placeholder="e.g. 9876543210">
      </div>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
        <a href="{{ url_for('customers.list_customers') }}" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
