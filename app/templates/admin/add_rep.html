{% extends 'base.html' %}
{% block title %}Add Rep{% endblock %}
{% block page_title %}Add Team Member{% endblock %}
{% block page_subtitle %}Create a new sales representative or admin account{% endblock %}

{% block content %}
<div style="max-width: 560px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <span class="card-title">User Details</span>
    </div>
    <form method="POST">
      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="e.g. Rajesh Kumar" required>
      </div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="rep@company.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210">
        </div>
      </div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label for="role">Role <span class="required">*</span></label>
          <select id="role" name="role">
            <option value="rep">Sales Rep</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>

      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus-fill"></i> Create User</button>
        <a href="{{ url_for('admin.team') }}" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
