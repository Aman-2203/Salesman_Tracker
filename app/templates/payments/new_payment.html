{% extends 'base.html' %}
{% block title %}Collect Payment{% endblock %}
{% block page_title %}Collect Cheque Payment{% endblock %}
{% block page_subtitle %}Record a cheque collection from a customer{% endblock %}

{% block content %}
<div style="max-width: 560px; margin: 0 auto;">
  <div class="card">
    <form method="POST" action="{{ url_for('payments.new_payment') }}">
      <div class="form-group">
        <label for="customer_id">Customer <span class="required">*</span></label>
        <select id="customer_id" name="customer_id" required>
          <option value="">Select customer...</option>
          {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }} — {{ c.area or c.city or 'N/A' }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="divider"></div>
      <div class="card-title mb-2"><i class="bi bi-credit-card"></i> Cheque Details</div>

      <div class="form-row cols-2">
        <div class="form-group">
          <label for="cheque_number">Cheque Number <span class="required">*</span></label>
          <input type="text" id="cheque_number" name="cheque_number" placeholder="e.g. 001234" required>
        </div>
        <div class="form-group">
          <label for="cheque_amount">Amount (₹) <span class="required">*</span></label>
          <input type="number" id="cheque_amount" name="cheque_amount" placeholder="0.00"
                 min="0.01" step="0.01" required>
        </div>
      </div>

      <div class="form-row cols-2">
        <div class="form-group">
          <label for="cheque_date">Cheque Date <span class="required">*</span></label>
          <input type="date" id="cheque_date" name="cheque_date" required>
        </div>
        <div class="form-group">
          <label for="bank_name">Bank Name</label>
          <input type="text" id="bank_name" name="bank_name" placeholder="e.g. HDFC Bank">
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Any additional notes about this collection..." style="min-height:70px;"></textarea>
      </div>

      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-success"><i class="bi bi-cash-stack"></i> Record Collection</button>
        <a href="{{ url_for('payments.list_payments') }}" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
// Default cheque date to today
document.getElementById('cheque_date').value = new Date().toISOString().split('T')[0];
</script>
{% endblock %}
