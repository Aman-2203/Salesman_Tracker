{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="bi bi-geo-alt-fill"></i></div>
      <div class="auth-logo-text">
        <h1>TraceIt</h1>
        <span>Field Sales Tracker</span>
      </div>
    </div>

    <p class="auth-subtitle">Sign in to access your sales dashboard and manage your team.</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required
               value="{{ request.form.get('email', '') }}">
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
        <input type="checkbox" id="remember" name="remember" style="width:auto;">
        <label for="remember" style="margin:0; font-weight:400; font-size:0.85rem;">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1rem;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <div class="divider"></div>
    <p class="text-center text-muted fs-sm">
      Default admin: <strong style="color:var(--text-secondary)">admin@salesforce.com</strong> / <strong style="color:var(--text-secondary)">admin123</strong>
    </p>
  </div>
</div>
{% endblock %}
